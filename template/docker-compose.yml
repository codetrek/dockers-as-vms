services:
  vm:
    container_name: "<VM Name, e.g.: borgee-dev>"
    build: ../runner-image
    image: vm-runner:ubuntu.24.04
    privileged: true
    hostname: "<Host Name, e.g.: borgee-dev>"
    cpus: 2
    mem_limit: 4g
    restart: unless-stopped
    cgroup: host
    networks:
      vmnet:
        ipv4_address: "<VM Addr within 172.28.1.0/24, e.g.: 172.28.1.10>"
    security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
    cap_add:
    - SYS_ADMIN
    volumes:
    - docker-disk:/var/lib/docker
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ./data/root:/root:rw
    - ./data/home:/home:rw
    - ./data/local:/usr/local:rw
    - ./data/opt:/opt:rw
    # The instance's own copy, taken from the template when it was created, so
    # that a VM keeps the installers it was made with rather than following the
    # template as that moves on.
    - ./scripts:/home/ubuntu/scripts:ro
    tmpfs:
    - /tmp:rw,nosuid,nodev,exec,mode=1777
    - /run
    - /run/lock
    environment:
      TZ: Asia/Shanghai

networks:
  # Shared by every VM, made by ../docker-vm.sh before the first `compose up`.
  vmnet:
    external: true
    name: vms_vmnet

volumes:
  docker-disk:
